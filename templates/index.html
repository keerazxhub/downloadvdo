<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บดาวน์โหลดวิดีโอออนไลน์ (Video Downloader)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen text-white flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-800/80 backdrop-blur-xl border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                🎬 Video Downloader
            </h1>
            <p class="text-slate-400 text-sm mt-2">
                ดาวน์โหลดวิดีโอและเสียงจาก YouTube, TikTok, Facebook และอื่นๆ ได้ฟรี!
            </p>
        </div>

        <!-- Form -->
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">วางลิงก์วิดีโอ (URL)</label>
                <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-white placeholder-slate-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">เลือกรูปแบบไฟล์</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center justify-center px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-purple-500 transition">
                        <input type="radio" name="fileType" value="video" checked class="text-purple-600 focus:ring-purple-500 mr-2">
                        <span class="text-sm font-medium">วิดีโอ (MP4)</span>
                    </label>
                    <label class="flex items-center justify-center px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-purple-500 transition">
                        <input type="radio" name="fileType" value="audio" class="text-purple-600 focus:ring-purple-500 mr-2">
                        <span class="text-sm font-medium">เสียง (MP3)</span>
                    </label>
                </div>
            </div>

            <button onclick="startDownload()" id="downloadBtn" 
                class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 font-semibold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
                <span>📥 เริ่มดาวน์โหลด</span>
            </button>
        </div>

        <!-- Status & Result Section -->
        <div id="statusContainer" class="mt-6 hidden">
            <div id="loadingBox" class="text-center py-4 text-slate-300 flex items-center justify-center space-x-3">
                <svg class="animate-spin h-6 w-6 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="statusText">กำลังดาวน์โหลด กรุณารอสักครู่...</span>
            </div>

            <div id="successBox" class="hidden text-center py-4 bg-emerald-900/30 border border-emerald-600/50 rounded-xl p-4">
                <p class="text-emerald-400 font-semibold mb-2">🎉 ดาวน์โหลดสำเร็จ!</p>
                <a id="downloadLink" href="#" class="inline-block px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg shadow transition">
                    💾 บันทึกลงเครื่อง
                </a>
            </div>

            <div id="errorBox" class="hidden text-center py-3 bg-rose-900/30 border border-rose-600/50 rounded-xl text-rose-400 text-sm">
                <span id="errorText"></span>
            </div>
        </div>
    </div>

    <script>
        async function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            const fileType = document.querySelector('input[name="fileType"]:checked').value;
            const downloadBtn = document.getElementById('downloadBtn');
            const statusContainer = document.getElementById('statusContainer');
            const loadingBox = document.getElementById('loadingBox');
            const successBox = document.getElementById('successBox');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const downloadLink = document.getElementById('downloadLink');

            if (!url) {
                alert('กรุณากรอกลิงก์วิดีโอก่อนดาวน์โหลด!');
                return;
            }

            // Reset UI
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusContainer.classList.remove('hidden');
            loadingBox.classList.remove('hidden');
            successBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, type: fileType })
                });

                const data = await response.json();
                loadingBox.classList.add('hidden');

                if (data.success) {
                    successBox.classList.remove('hidden');
                    downloadLink.href = data.download_url;
                    downloadLink.download = data.filename;
                } else {
                    errorBox.classList.remove('hidden');
                    errorText.textContent = data.error || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ';
                }
            } catch (err) {
                loadingBox.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorText.textContent = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้';
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
